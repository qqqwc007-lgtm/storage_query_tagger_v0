taxonomy_version: storage_taxonomy_v0.1
language: en
description: Initial faceted taxonomy for Storage & Organization query tagging.

dimensions:
  domain: {multi_label: false, description: Whether query is storage-related.}
  location: {multi_label: true, description: Explicit usage location or placement.}
  target_object: {multi_label: true, description: Object being stored, organized, displayed, or protected.}
  product_form: {multi_label: true, description: Product shape or storage form.}
  purpose: {multi_label: true, description: User purpose or intent.}
  attribute: {multi_label: true, description: Material, structure, placement, or feature.}
  scenario: {multi_label: true, description: Business-operational compound scenario.}

tags:
  - tag_id: domain_storage_related
    dimension: domain
    canonical_name: Storage Related
    zh_name: 收纳相关
    aliases: [storage related]
    definition: Query explicitly expresses storage, organization, display, or a storage product form.
    positive_examples: [shoe rack, closet organizers and storage, storage bins with lids]
    negative_examples: [shoes for women, old spice deodorant, under cabinet lighting]
    status: active
  - tag_id: domain_not_storage
    dimension: domain
    canonical_name: Not Storage
    zh_name: 非收纳
    aliases: [not storage]
    definition: Query is not about storage or organization.
    positive_examples: [old spice deodorant, nike shoes men, under cabinet lighting]
    negative_examples: [shoe rack, spice rack]
    status: active
  - tag_id: domain_ambiguous
    dimension: domain
    canonical_name: Ambiguous
    zh_name: 模糊
    aliases: [ambiguous]
    definition: Query may be related to storage, but lacks explicit evidence in v0.
    positive_examples: [lego, makeup, shelf]
    negative_examples: [lego storage box, makeup organizer]
    status: active

